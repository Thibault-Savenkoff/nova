name: Release

# v2.* tags publish a GitHub Release with Linux and macOS binaries (install.sh
# downloads these) and the Windows zip, NSIS installer and MSI (win/dist.sh).
# workflow_dispatch builds the same artifacts without publishing, to try the
# pipeline out.
on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          # GitHub's ARM runners are free for public repositories. install.sh already maps
          # aarch64 to arm64 and looks for this archive; it just never existed before.
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Lisaac Ω version from README.md
        id: lisaac
        run: |
          v=$(grep -oE '\[Lisaac Ω\]\(https://lisaac\.org\) compiler \([0-9][^)]*\)' README.md |
              grep -oE '\([0-9][^)]*\)$' | tr -d '()')
          [ -n "$v" ] || { echo "::error::could not read the Lisaac version from README.md" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Lisaac Ω has no prebuilt binary, so it is built here once per pinned version (the cache
      # key changes with it) and restored on every run after that. Only what compiling nova uses:
      # the compiler, lib/ and make.lip -- a few MB of the 61 MB zip. Lisaac's own install.sh also
      # builds elit, its editor, which needs GL and GLFW and fails to link on arm64 (it ships an
      # x86_64-only libglfw3.a), and it edits ~/.bashrc. nova needs none of that.
      - name: Restore/build Lisaac Ω ${{ steps.lisaac.outputs.version }}
        id: lisaac-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lisaac
          key: lisaac-compiler-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.lisaac.outputs.version }}

      - name: Build the Lisaac Ω compiler
        if: steps.lisaac-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lisaac.zip" \
            "https://lisaac.org/downloads/lisaac_${{ steps.lisaac.outputs.version }}.zip"
          unzip -q "$RUNNER_TEMP/lisaac.zip" 'lisaac/bin/lisaac.c' 'lisaac/lib/*' 'lisaac/make.lip' -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/lisaac"
          # The same command Lisaac's installer runs.
          gcc -Wno-unused bin/lisaac.c -o bin/lisaac -O2
          rm bin/lisaac.c
          # And the one setting it writes for the OS: "apple" swaps gcc's -flarge-source-files,
          # which Apple's clang rejects, for -w.
          if [ "${{ matrix.os }}" = macos ]; then
            sed -i.bak 's/+ target:String := "unix"/+ target:String := "apple"/' make.lip
            grep -q '+ target:String := "apple"' make.lip
          fi

      - name: Add Lisaac Ω to PATH
        run: echo "$RUNNER_TEMP/lisaac/bin" >> "$GITHUB_PATH"

      - name: Build nova
        run: |
          lisaac nova.li -boost
          ./nova --version

      - name: Pack the release archive
        run: |
          mkdir -p dist
          release/pack.sh ./nova ${{ matrix.os }} ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # The Windows job cross-compiles this instead of building Lisaac Ω again.
      # One copy is enough, and two linux jobs uploading the same name would fail.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        with:
          name: c-source
          path: nova.c
          if-no-files-found: error

  windows:
    # nova.exe and the WIC codec cross-compile from the nova.c the Linux job
    # already wrote. Fedora because win/dist.sh reads MinGW's Fedora sysroot
    # and needs mingw64-zlib/mingw64-libwebp, which Debian and Ubuntu do not
    # package at all.
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # git and tar are what checkout and the artifact actions need; the rest
      # is the list win/dist.sh documents.
      - name: Install the cross-compiler and the packaging tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git tar zip \
            mingw64-gcc mingw64-gcc-c++ mingw64-zlib mingw64-libwebp \
            mingw64-LibRaw mingw64-winpthreads mingw64-binutils mingw64-pkg-config \
            cmake yasm perl mingw32-nsis msitools

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: c-source

      # Fedora packages no mingw64 libheif, libde265, aom or libavif, so win/deps.sh cross-compiles
      # them. The cache key is the script itself: it carries the pinned versions and the cmake
      # options, so changing either rebuilds, and nothing else does. restore-keys brings back the
      # previous tree on any edit, and deps.sh skips per library from its own markers -- editing
      # one library's flags then does not pay for aom again (~10 min on its own).
      - name: Restore/build the cross-compiled libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/windeps
          key: windeps-${{ hashFiles('win/deps.sh') }}
          restore-keys: windeps-

      - name: Cross-compile libheif, libde265, kvazaar, aom and libavif
        run: bash win/deps.sh "$RUNNER_TEMP/windeps"

      - name: Build the Windows files
        run: bash win/dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: |
            dist/nova-*-windows-x86_64*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches nova.li's version
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          v=$(sed -n 's/.*- version:String := "\(.*\)"/\1/p' nova.li)
          [ "$tag" = "$v" ] || { echo "::error::tag v$tag does not match nova.li's version ($v); bump nova.li first" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          # Only the release files: c-source is the Windows job's input, not
          # something to attach to the release.
          pattern: nova-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # Hand-written notes when release/NOTES-<tag>.md exists, else from the commits.
          notes=release/NOTES-$tag.md
          set --
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; fi
          case "$tag" in *beta*|*alpha*|*rc*) set -- "$@" --prerelease ;; esac
          # The release can exist before this job runs: creating a tag from the web UI (the only way
          # without a clone) creates one too, and a re-run after a failed publish finds its own.
          # Fill that one in rather than failing on "release already exists".
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "NOVA $tag" "$@"
            gh release upload "$tag" dist/* --clobber
          else
            # --generate-notes has no `edit` equivalent, so it only applies on the create path.
            if [ ! -f "$notes" ]; then set -- "$@" --generate-notes; fi
            gh release create "$tag" dist/* --title "NOVA $tag" "$@"
          fi
