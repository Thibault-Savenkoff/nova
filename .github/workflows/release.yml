name: Release

# v2.* tags publish a GitHub Release with Linux and macOS binaries (install.sh
# downloads these) and the Windows zip, NSIS installer and MSI (win/dist.sh).
# Every push to the v2 branch (and workflow_dispatch) builds and tests the same
# artifacts without publishing. Markdown-only pushes skip it (paths filters do
# not apply to tags, so a release always runs).
on:
  push:
    branches: [v2]
    tags: ["v2.*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A newer push to the branch makes the running check pointless; a tag run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default: the build jobs run code downloaded from third parties (the Lisaac zip,
# libheif, kvazaar, aom...). Only publish gets to write, and it runs none of that.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          # GitHub's ARM runners are free for public repositories. install.sh already maps
          # aarch64 to arm64 and looks for this archive; it just never existed before.
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Lisaac Ω version from README.md
        id: lisaac
        run: |
          v=$(grep -oE '\[Lisaac Ω\]\(https://lisaac\.org\) compiler \([0-9][^)]*\)' README.md |
              grep -oE '\([0-9][^)]*\)$' | tr -d '()')
          [ -n "$v" ] || { echo "::error::could not read the Lisaac version from README.md" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Lisaac republishes under the same number (0.6 was replaced on 2026-09-22): the zip's
          # ETag goes into the cache key too, so a new upload rebuilds the compiler.
          etag=$(curl -fsSI "https://lisaac.org/downloads/lisaac_$v.zip" | tr -d '\r' |
                 awk -F': ' 'tolower($1) == "etag" {print $2}' | tr -cd 'A-Za-z0-9-')
          [ -n "$etag" ] || { echo "::error::no ETag for lisaac_$v.zip" >&2; exit 1; }
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      # Lisaac Ω has no prebuilt binary, so it is built here once per pinned version and zip
      # upload (the cache key has both: version and ETag) and restored on every run after that. Only what compiling nova uses:
      # the compiler, lib/ and make.lip -- a few MB of the 61 MB zip. Lisaac's own install.sh also
      # builds elit, its editor, which needs GL and GLFW and fails to link on arm64 (it ships an
      # x86_64-only libglfw3.a), and it edits ~/.bashrc. nova needs none of that.
      - name: Restore/build Lisaac Ω ${{ steps.lisaac.outputs.version }}
        id: lisaac-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lisaac
          key: lisaac-compiler-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.lisaac.outputs.version }}-${{ steps.lisaac.outputs.etag }}

      - name: Build the Lisaac Ω compiler
        if: steps.lisaac-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lisaac.zip" \
            "https://lisaac.org/downloads/lisaac_${{ steps.lisaac.outputs.version }}.zip"
          unzip -q "$RUNNER_TEMP/lisaac.zip" 'lisaac/bin/lisaac.c' 'lisaac/lib/*' 'lisaac/make.lip' -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/lisaac"
          # The same command Lisaac's installer runs.
          gcc -Wno-unused bin/lisaac.c -o bin/lisaac -O2
          rm bin/lisaac.c
          # And the one setting it writes for the OS: "apple" swaps gcc's -flarge-source-files,
          # which Apple's clang rejects, for -w.
          if [ "${{ matrix.os }}" = macos ]; then
            sed -i.bak 's/+ target:String := "unix"/+ target:String := "apple"/' make.lip
            grep -q '+ target:String := "apple"' make.lip
          fi

      - name: Add Lisaac Ω to PATH
        run: echo "$RUNNER_TEMP/lisaac/bin" >> "$GITHUB_PATH"

      - name: Build nova
        run: |
          lisaac nova.li -boost
          ./nova --version

      # The unit tests (with the corrupt-file fuzz, which needs uv) and the install.sh test, once:
      # they test nova's code and the installer, not the platform.
      - uses: astral-sh/setup-uv@v6
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'

      - name: Tests
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          test/unit.sh
          test/install.sh

      - name: Pack the release archive
        run: |
          mkdir -p dist
          release/pack.sh ./nova ${{ matrix.os }} ${{ matrix.arch }} dist

      # What a user gets: install.sh from this archive, which builds libnova-heif, then a HEIC
      # written from the sample photo must carry its HDR gain map (the ISO 21496-1 tmap item).
      # On the Intel Mac for releases only: it takes 5 of that job's 6 minutes, and Windows waits
      # for every build. Still run before a release because it is the only build of kvazaar's x86
      # assembly by Apple's clang.
      - name: Install from the archive, write a HEIC with its gain map
        if: matrix.runner != 'macos-15-intel' || startsWith(github.ref, 'refs/tags/')
        run: |
          ./install.sh --from dist/nova-*.tar.gz --prefix "$RUNNER_TEMP/p" -y --no-plugins
          "$RUNNER_TEMP/p/bin/nova" decode docs/samples/photo.nova "$RUNNER_TEMP/hdr.heic"
          grep -q tmap "$RUNNER_TEMP/hdr.heic" || { echo "::error::no gain map (tmap) in the HEIC" >&2; exit 1; }

      # macOS: an input of the universal job below, not a release file (publish takes nova-*).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'macos' && 'part' || 'nova' }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # The Windows job cross-compiles this instead of building Lisaac Ω again.
      # One copy is enough, and two linux jobs uploading the same name would fail.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        with:
          name: c-source
          path: nova.c
          if-no-files-found: error

  # One macOS download for both kinds of Mac: the arm64 and x86_64 binaries joined with lipo.
  # Nothing else in the archive depends on the processor (libnova-heif is built at install).
  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: part-macos-*
          path: parts

      - name: Join the two binaries, pack, install from the archive
        run: |
          for a in arm64 x86_64; do
            mkdir -p "parts/$a"
            tar -xzf parts/part-macos-$a/nova-*-macos-$a.tar.gz -C "parts/$a"
          done
          lipo -create -output nova parts/arm64/nova-*/bin/nova parts/x86_64/nova-*/bin/nova
          lipo -archs nova | grep -qw arm64
          lipo -archs nova | grep -qw x86_64
          mkdir -p dist
          release/pack.sh ./nova macos universal dist
          ./install.sh --from dist/nova-*-macos-universal.tar.gz --prefix "$RUNNER_TEMP/p" -y --no-plugins --no-heic-hdr
          "$RUNNER_TEMP/p/bin/nova" --version

      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos-universal
          path: dist/*
          if-no-files-found: error

  windows:
    # nova.exe and the WIC codec cross-compile from the nova.c the Linux job
    # already wrote. Fedora because win/dist.sh reads MinGW's Fedora sysroot
    # and needs mingw64-zlib/mingw64-libwebp, which Debian and Ubuntu do not
    # package at all.
    needs: build
    runs-on: ubuntu-latest
    # Pinned: the cached cross-compiled libraries (key below) were built by this Fedora's MinGW.
    # Bump both together.
    container: fedora:44
    steps:
      # git and tar are what checkout and the artifact actions need; the rest
      # is the list win/dist.sh documents.
      - name: Install the cross-compiler and the packaging tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git tar zip \
            mingw64-gcc mingw64-gcc-c++ mingw64-zlib mingw64-libwebp \
            mingw64-LibRaw mingw64-winpthreads mingw64-binutils mingw64-pkg-config \
            cmake yasm perl patch mingw32-nsis msitools

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: c-source

      # Fedora packages no mingw64 libheif, libde265, aom or libavif, so win/deps.sh cross-compiles
      # them, and libnova-heif (libheif-gainmap/). The cache key is those scripts and the Fedora
      # release: they carry the pinned versions and the cmake options, so changing any rebuilds,
      # and nothing else does. restore-keys brings back the
      # previous tree on any edit, and deps.sh skips per library from its own markers -- editing
      # one library's flags then does not pay for aom again (~10 min on its own).
      - name: Restore/build the cross-compiled libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/windeps
          key: windeps-fedora44-${{ hashFiles('win/deps.sh', 'libheif-gainmap/*') }}
          restore-keys: windeps-fedora44-

      - name: Cross-compile libheif, libde265, kvazaar, aom, libavif and libnova-heif
        run: bash win/deps.sh "$RUNNER_TEMP/windeps"

      - name: Build the Windows files
        run: bash win/dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: |
            dist/nova-*-windows-x86_64*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [build, macos-universal, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches nova.li's version
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          v=$(sed -n 's/.*- version:String := "\(.*\)"/\1/p' nova.li)
          [ "$tag" = "$v" ] || { echo "::error::tag v$tag does not match nova.li's version ($v); bump nova.li first" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          # Only the release files: c-source is the Windows job's input, not
          # something to attach to the release.
          pattern: nova-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # One SHA256SUMS for every file (install.sh reads it), also shown in the notes as a
          # collapsed block.
          (cd dist && sha256sum nova-* > SHA256SUMS)
          # Hand-written notes when release/NOTES-<tag>.md exists; else the body already on the
          # release (the web form's), minus a checksum block from an earlier run; else empty, and
          # the commits' notes come before it (--generate-notes, create only).
          notes=release/NOTES-$tag.md
          body=$RUNNER_TEMP/body.md
          if [ -f "$notes" ]; then
            cp "$notes" "$body"
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json body --jq .body | sed '/^<details><summary>SHA-256/,$d' > "$body"
          else
            : > "$body"
          fi
          { printf '\n<details><summary>SHA-256 checksums</summary>\n\n```\n'; cat dist/SHA256SUMS; printf '```\n\n</details>\n'; } >> "$body"
          set -- --notes-file "$body"
          case "$tag" in *beta*|*alpha*|*rc*) set -- "$@" --prerelease ;; esac
          # The release can exist before this job runs: creating a tag from the web UI (the only way
          # without a clone) creates one too, and a re-run after a failed publish finds its own.
          # Fill that one in rather than failing on "release already exists".
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "NOVA $tag" "$@"
            gh release upload "$tag" dist/* --clobber
          else
            # --generate-notes has no `edit` equivalent, so it only applies on the create path.
            if [ ! -f "$notes" ]; then set -- "$@" --generate-notes; fi
            gh release create "$tag" dist/* --title "NOVA $tag" "$@"
          fi
